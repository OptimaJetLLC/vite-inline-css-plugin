on:
  pull_request:
  push:
    branches: main

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - run: npm ci
      - run: npm test
      - uses: JS-DevTools/npm-publish@v4
        if: github.event_name == 'push'
        with:
          token: ${{ secrets.NPM_TOKEN }}
